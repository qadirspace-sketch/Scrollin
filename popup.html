<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollin</title>
  <style>
    @font-face { font-family: "Inter"; src: url("src/fonts/Inter-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      background: #F4F4F4;
      color: #111111;
      width: 320px;
      min-height: 200px;
      padding: 20px;
    }

    .content { position: relative; }

    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }

    .logo-icon {
      width: 36px; height: 36px;
      background: #111111;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .header-text h1 { font-size: 18px; font-weight: 700; color: #111111; }
    .header-text p { font-size: 12px; color: #6B6B6B; font-weight: 500; }

    .menu-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
    }
    .menu-item:hover { border-color: #D4D4D4; transform: translateY(-1px); }

    .menu-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .menu-icon.watchlist, .menu-icon.logs { background: #F4F4F4; }

    .menu-label { flex: 1; }
    .menu-label .title { font-size: 14px; font-weight: 600; color: #111111; }
    .menu-label .subtitle { font-size: 12px; color: #6B6B6B; margin-top: 2px; }

    .menu-arrow { color: #111111; font-size: 16px; transition: transform 0.2s; }
    .menu-item:hover .menu-arrow { transform: translateX(3px); }

    .version { text-align: center; font-size: 11px; color: #6B6B6B; margin-top: 16px; font-weight: 500; }
  </style>
</head>

<body>
  <div class="content">
    <div class="header">
      <div class="logo-icon">⚡</div>
      <div class="header-text">
        <h1>Scrollin</h1>
        <p>LinkedIn Post Intelligence</p>
      </div>
    </div>



    <a class="menu-item" id="clearLogs">
      <div class="menu-icon logs">🗑️</div>
      <div class="menu-label">
        <div class="title">Clear All Data</div>
        <div class="subtitle">Remove all stored posts & logs</div>
      </div>
      <div class="menu-arrow">→</div>
    </a>

    <div class="version">Scrollin v3.0</div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
