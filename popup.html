<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hleo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 320px;
      min-height: 200px;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(79, 70, 229, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text p {
      font-size: 11px;
      color: #475569;
      font-weight: 500;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: rgba(30, 33, 44, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
    }

    .menu-item:hover {
      background: rgba(30, 33, 44, 0.95);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .menu-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .menu-icon.watchlist {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
    }

    .menu-icon.logs {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(96, 165, 250, 0.2) 100%);
    }

    .menu-label {
      flex: 1;
    }

    .menu-label .title {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .menu-label .subtitle {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .menu-arrow {
      color: #475569;
      font-size: 16px;
      transition: transform 0.2s;
    }

    .menu-item:hover .menu-arrow {
      transform: translateX(3px);
    }

    .version {
      text-align: center;
      font-size: 10px;
      color: #334155;
      margin-top: 16px;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="content">
    <div class="header">
      <div class="logo-icon">⚡</div>
      <div class="header-text">
        <h1>Hleo</h1>
        <p>LinkedIn Post Intelligence</p>
      </div>
    </div>



    <a class="menu-item" id="clearLogs">
      <div class="menu-icon logs">🗑️</div>
      <div class="menu-label">
        <div class="title">Clear All Data</div>
        <div class="subtitle">Remove all stored posts & logs</div>
      </div>
      <div class="menu-arrow">→</div>
    </a>

    <div class="version">Hleo v1.0 — Beta</div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
